  <!--
  QUANTBUDDY: ONE-FILE WEBSITE
  This whole site lives in this one file, in 4 parts:
  1) <style>  = how it LOOKS (colours, sizes, animations). This is CSS.
  2) <div id="root"> = an empty box where the app gets drawn.
  3) <script src=...> = three helper libraries (React + Babel).
  4) <script type="text/babel"> = how it WORKS (all the pages and logic).
  Tip: use Ctrl+F to jump around. Search for the page name, e.g. 'function Tracker'.
-->
  <style>
    /* COLOUR THEMES. These --names are variables: define a colour once, reuse it everywhere with var(--name). */
    /* This first block is the DARK theme (deep navy + gold). Change a value here and the whole site updates. */
    :root {
      --bg: #040916;
      --card: #091128;
      --text: #f1e9d2;
      --muted: #8e99bd;
      --gold: #e8c46c;
      --gold2: #f7e3a1;
      --glow: rgba(232, 196, 108, .09);
      --goldtxt: #040916;
      --soft: #0d1836;
      --line: #18264d;
      --ok: #3fbf8a;
      --bad: #e5645f;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    /* LIGHT theme. The Light/Dark button switches the page's data-theme attribute, which swaps these values in. */
    :root[data-theme="light"] {
      --bg: #f7f3e8;
      --card: #fffdf6;
      --text: #0a1530;
      --muted: #5d6785;
      --gold: #a67c0e;
      --goldtxt: #fffdf6;
      --soft: #efe8d2;
      --line: #e0d6b6;
      --ok: #1c8a5c;
      --bad: #c0392b;
      --gold2: #c99a1b;
      --glow: rgba(166, 124, 14, .07);
      color-scheme: light
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    /* BASE LOOK: page background, text colour and the main font (DM Sans). Headings use Playfair Display. */
    body {
      margin: 0;
      background: radial-gradient(900px 440px at 50% -90px, var(--glow), transparent) no-repeat, var(--bg);
      color: var(--text);
      font: 16px/1.6 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      padding-bottom: 84px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: "Playfair Display", Georgia, serif;
      letter-spacing: .2px
    }

    h2 {
      font-size: 26px;
      margin: .4em 0
    }

    h3 {
      font-size: 19px;
      margin: 1em 0 .3em
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px
    }

    /* TICKER: the scrolling headline strip at the very top of the page. */
    .tick {
      overflow: hidden;
      white-space: nowrap;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: 13px;
      color: var(--muted)
    }

    .tick div {
      display: inline-block;
      padding: 7px 0;
      animation: mq 60s linear infinite
    }

    .tick b {
      color: var(--gold);
      margin: 0 8px 0 24px;
      font-weight: 700
    }

    /* KEYFRAMES describe an animation. This one slides text left forever (used by the scrolling strips). */
    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    /* HEADER and LOGO. */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0 10px
    }

    .logo {
      font: 800 24px "Playfair Display", Georgia, serif;
      cursor: pointer
    }

    .logo span {
      color: var(--gold)
    }

    /* BUTTONS: gold pill by default. 'ghost' = outline only, 'sm' = small. */
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 10px 20px;
      background: var(--gold);
      color: var(--goldtxt);
      font-weight: 700;
      transition: transform .12s, opacity .2s
    }

    button:active {
      transform: scale(.97)
    }

    button.ghost {
      background: transparent;
      color: var(--gold)
    }

    button.sm {
      padding: 5px 11px;
      font-size: 14px
    }

    /* CARDS: the rounded boxes used all over the site. */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 10px 28px -14px rgba(0, 0, 0, .6)
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .grow {
      flex: 1;
      min-width: 0
    }

    .muted {
      color: var(--muted);
      font-size: 14px
    }

    .gold {
      color: var(--gold)
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700
    }

    .bar {
      height: 5px;
      background: var(--soft);
      margin-top: 8px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--gold);
      transition: width .6s
    }

    /* HERO and PROGRESS RING (the circle that fills up as you finish topics). */
    .hero {
      display: flex;
      gap: 18px;
      align-items: center;
      padding: 18px 4px
    }

    .ring {
      transform: rotate(-90deg)
    }

    .ring circle {
      fill: none;
      stroke-width: 9
    }

    .ring .tr {
      stroke: var(--soft)
    }

    .ring .pr {
      stroke: var(--gold);
      stroke-linecap: round;
      transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1)
    }

    .mod {
      cursor: pointer;
      transition: transform .15s, border-color .2s
    }

    .mod:hover {
      transform: translateX(4px)
    }

    .mod.soon {
      opacity: .5;
      cursor: default
    }

    .mod.soon:hover {
      transform: none
    }

    .num {
      font: 800 28px "Playfair Display", Georgia, serif;
      color: var(--gold);
      min-width: 42px
    }

    .fact {
      background: linear-gradient(135deg, var(--card), var(--soft));
      border: 1px dashed var(--gold);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin: 8px 0
    }

    .tabs button {
      background: transparent;
      color: var(--text);
      border-color: var(--line)
    }

    .tabs button.on {
      background: var(--gold);
      color: var(--goldtxt);
      border-color: var(--gold)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 7px 0;
      background: transparent;
      color: var(--text);
      border-color: var(--line);
      font-weight: 500
    }

    .opt:hover {
      border-color: var(--gold)
    }

    .opt.right {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff
    }

    .opt.wrong {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff
    }

    /* FLASHCARD FLIP: two faces (front and back) sit on top of each other. Adding the class 'on' rotates the card 180 degrees. */
    .flip {
      perspective: 900px;
      height: 170px;
      margin: 10px 0;
      cursor: pointer
    }

    .flip>div {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .55s;
      transform-style: preserve-3d
    }

    .flip.on>div {
      transform: rotateY(180deg)
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      border-radius: 16px;
      background: var(--soft);
      border: 1px solid var(--gold);
      font: 600 20px "Playfair Display", Georgia, serif
    }

    .face.back {
      transform: rotateY(180deg);
      background: var(--card);
      font: 500 16px "DM Sans", system-ui, sans-serif
    }

    input[type=search] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font: inherit
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--gold)
    }

    .check {
      width: 22px;
      height: 22px;
      accent-color: var(--gold)
    }

    .big {
      font: 800 30px "Playfair Display", Georgia, serif;
      color: var(--gold)
    }

    .cmp {
      height: 26px;
      margin: 6px 0;
      color: var(--goldtxt);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      white-space: nowrap;
      transition: width .4s;
      min-width: 70px
    }

    /* BOTTOM NAV BAR on phones (fixed = stays stuck to the bottom of the screen). */
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--card);
      border-top: 1px solid var(--gold);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 5
    }

    .nav button {
      flex: 1;
      background: transparent;
      border: 0;
      border-radius: 0;
      color: var(--muted);
      padding: 14px 0;
      font-size: 14px
    }

    .nav button.on {
      color: var(--gold)
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1.5px;
      padding: 2px 8px;
      border: 1px solid var(--gold);
      color: var(--gold);
      margin-bottom: 6px
    }

    .lens {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--soft);
      font-size: 14px
    }

    .lp-h {
      font: 800 36px/1.15 "Playfair Display", Georgia, serif;
      margin: 6px 0 10px
    }

    .gt {
      background: linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .stats {
      display: flex;
      gap: 8px;
      margin: 16px 0 22px
    }

    .stats div {
      flex: 1;
      border: 1px solid var(--line);
      padding: 10px 4px;
      text-align: center;
      border-radius: 16px;
      background: var(--card);
      font-size: 13px;
      color: var(--muted)
    }

    .stats b {
      display: block;
      font: 800 24px "Playfair Display", Georgia, serif;
      color: var(--gold)
    }

    .stack {
      display: flex;
      height: 14px;
      margin: 12px 0 4px;
      gap: 2px
    }

    .stack div {
      transition: flex .5s
    }

    /* FLOWCHART on the Home page: .lvl is one row of boxes, .node is one box, .link is the line between rows. */
    .lvl {
      display: flex;
      gap: 8px;
      justify-content: center
    }

    .node {
      flex: 1;
      max-width: 230px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 16px;
      padding: 10px 6px 12px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: fd .5s ease both;
      transition: border-color .2s, transform .15s, box-shadow .2s
    }

    .node:hover {
      border-color: var(--gold);
      transform: translateY(-2px)
    }

    .node.sel {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold), 0 12px 30px -14px var(--gold)
    }

    .node small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px
    }

    .node b {
      display: block;
      font-size: 13px;
      line-height: 1.25;
      margin: 2px 0 4px
    }

    .node .w {
      font: 800 22px "Playfair Display", Georgia, serif;
      color: var(--gold)
    }

    .node i {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      background: var(--gold)
    }

    .link {
      height: 28px;
      width: 2px;
      margin: 0 auto;
      background: linear-gradient(var(--gold), transparent)
    }

    /* TILES: the 2-column grid of page shortcuts. */
    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0 22px
    }

    .tile {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      transition: transform .15s, border-color .2s
    }

    .tile:hover {
      border-color: var(--gold);
      transform: translateY(-2px)
    }

    .tile small {
      color: var(--gold);
      letter-spacing: 1.5px;
      font-size: 11px
    }

    .tile b {
      display: block;
      margin: 2px 0
    }

    .tf {
      display: flex;
      gap: 10px
    }

    .tf button {
      flex: 1;
      padding: 14px
    }

    @keyframes shine {
      to {
        background-position: 200% center
      }
    }

    @keyframes shake {

      20%,
      60% {
        transform: translateX(-6px)
      }

      40%,
      80% {
        transform: translateX(6px)
      }
    }

    @keyframes pop {
      50% {
        transform: scale(1.04)
      }
    }

    @keyframes grow {
      from {
        transform: scaleY(0)
      }
    }

    @keyframes cf {
      from {
        opacity: 1;
        transform: translate(0, 0) rotate(0)
      }

      to {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(var(--r))
      }
    }

    .gt {
      background-size: 200% auto;
      animation: shine 5s linear infinite
    }

    .opt.right {
      animation: pop .4s
    }

    .opt.wrong {
      animation: shake .4s
    }

    .link {
      transform-origin: top;
      animation: grow .5s .3s ease both
    }

    /* STAGGER: children of a page fade in one after another, each slightly delayed (the nth-child lines below set the delays). */
    .stagger>* {
      animation: fd .5s ease both
    }

    .stagger>*:nth-child(2) {
      animation-delay: 0.06s
    }

    .stagger>*:nth-child(3) {
      animation-delay: 0.12s
    }

    .stagger>*:nth-child(4) {
      animation-delay: 0.18s
    }

    .stagger>*:nth-child(5) {
      animation-delay: 0.24s
    }

    .stagger>*:nth-child(6) {
      animation-delay: 0.30s
    }

    .stagger>*:nth-child(7) {
      animation-delay: 0.36s
    }

    .stagger>*:nth-child(8) {
      animation-delay: 0.42s
    }

    .stagger>*:nth-child(9) {
      animation-delay: 0.48s
    }

    .stagger>*:nth-child(10) {
      animation-delay: 0.54s
    }

    .stagger>*:nth-child(11) {
      animation-delay: 0.60s
    }

    .stagger>*:nth-child(12) {
      animation-delay: 0.66s
    }

    .cf {
      position: fixed;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 99;
      animation: cf 1.1s ease-out forwards
    }

    .nav button.on {
      position: relative
    }

    .nav button.on::after {
      content: "";
      position: absolute;
      left: 30%;
      right: 30%;
      top: 0;
      height: 2px;
      background: var(--gold);
      animation: grow .3s
    }

    .tile,
    .card.row,
    .mod {
      transition: transform .2s, border-color .2s, box-shadow .2s
    }

    .tile:hover,
    .mod:hover {
      box-shadow: 0 14px 30px -16px var(--gold)
    }

    /* ACCESSIBILITY: if someone's phone says 'reduce motion', switch all animations off. */
    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    /* EXTRA STYLES for the editorial Home page, the top menu and the scrolling strips. */
    .opt {
      border-radius: 16px
    }

    .wrap.wide {
      max-width: 1040px
    }

    .topnav {
      display: none;
      gap: 4px
    }

    .topnav button {
      background: transparent;
      border: 0;
      color: var(--muted);
      padding: 6px 12px;
      font-weight: 500
    }

    .topnav button.on,
    .topnav button:hover {
      color: var(--gold)
    }

    /* RESPONSIVE: on screens wider than 700px (laptops) hide the bottom bar and show the top menu instead. */
    @media (min-width:700px) {
      .nav {
        display: none
      }

      .topnav {
        display: flex
      }

      body {
        padding-bottom: 24px
      }
    }

    .mqrow {
      overflow: hidden;
      white-space: nowrap;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      margin: 14px 0;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted)
    }

      text-transform: none;
      letter-spacing: 0;
      color: var(--gold)
    }

    }

    .mqi.rev {
      animation-direction: reverse
    }

    .mqi span {
      display: inline-block
    }

    .name {

      letter-spacing: -2px;
      margin: 0
    }

    .lead {
      font-size: 18px;
      max-width: 520px;
      color: var(--muted);
      margin: 18px 0
    }

    .sec {
      margin: 60px 0
    }

    .sh {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 14px
    }

    .sh h2 {
      font-size: 34px;
      margin: 0
    }

    .snap {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 4px 2px
    }

    .snap::-webkit-scrollbar {
      display: none
    }

    .ht {
      flex: 0 0 min(72vw, 290px);
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      overflow: hidden;
      cursor: pointer;
      transition: transform .25s, border-color .2s
    }

    .ht:hover {
      transform: translateY(-6px);
      border-color: var(--gold)
    }

    .ht .art {
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      background: radial-gradient(circle at 30% 20%, var(--soft), transparent 70%)
    }

      width: 58%;
      transition: transform .5s
    }

    .ht:hover .art svg {
      transform: scale(1.15) rotate(-4deg)
    }

      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      font-weight: 700
    }

    .ht .cap span {
      color: var(--muted);
      font-weight: 500;
      font-size: 13px
    }

    .sc {
      flex: 0 0 min(78vw, 310px);
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      background: var(--card);
      transition: transform .25s, border-color .25s
    }

    .sc:hover {
      transform: translateY(-4px);
      border-color: var(--gold)
    }

    .sc .n {
      font: 800 40px "Playfair Display", Georgia, serif;
      color: var(--gold)
    }

    .wk {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 4px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: padding .25s, background .25s
    }

    .wk:hover {
      padding-left: 16px;
      background: var(--soft)
    }

    .wk .arr {
      font-size: 22px;
      color: var(--gold);
      transition: transform .25s
    }

    .wk:hover .arr {
      transform: translateX(6px)
    }

    .wk.soon {
      opacity: .45;
      cursor: default
    }

    .wk.soon:hover {
      padding-left: 4px;
      background: none
    }

    .pill {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap
    }

    .big2 {
      font: 800 clamp(36px, 9vw, 64px)/1.05 "Playfair Display", Georgia, serif;
      margin: 6px 0 14px
    }

    .para {
      font-size: 18px;
      max-width: 580px
    }

    .foot {
      border-top: 1px solid var(--line);
      padding: 40px 0 10px;
      text-align: center
    }

    .foot .name {
      font-size: clamp(40px, 12vw, 110px)
    }

    .name.gt {
      padding-bottom: .22em;
      margin-bottom: -.14em;
      overflow: visible
    }

    .fade {
      animation: fd .35s ease both
    }

    @keyframes fd {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }
  </style>
</head>

      { k: "quizzes", t: "Quizzes", s: "Topic quizzes and a mixed challenge" },
      { k: "practice", t: "Practice", s: "Flashcard drills and number games" },
      { k: "facts", t: "Fun facts round", s: "True or false. How many can you get?" },
      { k: "news", t: "Market news", s: "What’s moving markets, simply" },
      { k: "gloss", t: "Glossary", s: "ELI5, Gen Z and proper meanings" },
      { k: "tracker", t: "My tracker", s: "Progress, scores and weak spots" },
      { k: "about", t: "About", s: "Why we built QuantBuddy" }
    ];
    const TF = [
      { s: "The Dutch East India Company, founded in 1602, is often called the first publicly traded company.", a: true, why: "Yes. It sold shares to the public, and they traded in Amsterdam." },
      { s: "Compound interest means you only earn interest on your original amount.", a: false, why: "That’s simple interest. Compound interest also earns interest on past interest." },
      { s: "At 6% a year, money roughly doubles in 12 years.", a: true, why: "Rule of 72: 72 ÷ 6 = 12." },
      { s: "A fair coin that landed heads 5 times in a row is now “due” for tails.", a: false, why: "Each flip is independent. The coin has no memory." },
      { s: "In a normal distribution, about 99.7% of values fall within 3 standard deviations of the mean.", a: true, why: "That’s the 68-95-99.7 rule." },
      { s: "Diversification guarantees you will never lose money.", a: false, why: "It softens the damage from any single bet, but can’t remove market risk." },
      { s: "A hedge fund with Nobel Prize winners on board collapsed in 1998.", a: true, why: "Long-Term Capital Management. Great models still fail when the world surprises them." },
      { s: "The VIX is often called the market’s “fear gauge”.", a: true, why: "It tracks expected swings in US stocks and tends to jump when investors get nervous." }
    ];
    // makeQ: builds one random practice question (an average, the Rule of 72, or a dice probability) with 3 wrong options.
    const makeQ = () => {
      const t = rnd(3); let q, ans, wrong, why;
      if (t === 0) { const m = 7 + rnd(8), e1 = rnd(5) - 1, e2 = rnd(5) - 1, x = m + e1, y = m + e2, z = m - e1 - e2; q = "What is the mean of " + x + ", " + y + " and " + z + "?"; ans = m; wrong = [m + 1, m - 1, m + 2]; why = "Add them (" + (x + y + z) + ") and divide by 3."; }
      else if (t === 1) { const r = [2, 3, 4, 6, 8, 9, 12][rnd(7)], a = 72 / r; q = "Rule of 72: roughly how many years to double money at " + r + "% a year?"; ans = a; wrong = [a + 3, Math.max(1, a - 2), a * 2]; why = "72 ÷ " + r + " = " + a + "."; }
      else { const k = 1 + rnd(4); q = "Fair die: what is P(rolling more than " + k + ")?"; ans = (6 - k) + "/6"; wrong = [k + "/6", (7 - k) + "/6", (5 - k) + "/6", "1/6"]; why = "Numbers above " + k + ": " + (6 - k) + " of 6 outcomes."; }
      const pool = [...new Set(wrong.map(String))].filter(w => w !== String(ans)).slice(0, 3);
      const o = shuffle([String(ans), ...pool]);
      return { q, o, a: o.indexOf(String(ans)), why };
    };

    // PageGrid: the tiles. Clicking one calls go({ v: pageName }), which changes the address and the page.
    function PageGrid({ go }) {
      return <div className="tiles">{PAGES.map((p, i) => <div key={p.k} className="tile" onClick={() => go({ v: p.k })}><small>{String(i + 1).padStart(2, "0")}</small><b>{p.t}</b><span className="muted">{p.s}</span></div>)}</div>;
    }
    // About page content. Each FAQ item opens and closes when clicked.
    const FAQ = [
      { q: "Do I need a finance or maths background?", a: "No. Start Here assumes nothing, and every module builds step by step." },
      { q: "How long does the full roadmap take?", a: "About 14 weeks at 5 to 6 hours a week. Go faster or slower, whatever suits you." },
      { q: "Where is my progress saved?", a: "In your own browser, on the device you use. It doesn’t sync between phones yet." },
      { q: "Are the market notes live?", a: "No. They’re a dated snapshot for learning, not live prices and not investment advice." },
      { q: "Can I suggest a topic or a playlist?", a: "Yes. Tell whoever runs the site and it can be added." }
    ];
    // About: story, stats and the FAQ. 'open' remembers which question is expanded.
    function About({ go }) {
      const [open, setOpen] = useState(0);
      return <div className="fade stagger"><div className="eyebrow">About</div><h2 className="big2">Why we built QuantBuddy.</h2>
        <p className="para">Quant finance has a reputation for being scary. Most of it is ideas you can learn step by step, if someone starts at the beginning. This site is that beginning, made for classmates who want to learn without feeling lost.</p>
        <p className="para">Each topic has a plain-language intro, videos, a quiz and flashcards. You can track your progress, practise with drills and games, and look up any term at three levels of explanation.</p>
        <div className="stats"><div><b>{MODULES.length}</b>modules</div><div><b>{flat.length}</b>topics</div><div><b>{flat.reduce((a, x) => a + x.t.quiz.length, 0)}</b>quiz questions</div></div>
        <h3>Questions</h3>
        {FAQ.map((f, i) => <div className="card" key={i} style={{ cursor: "pointer" }} onClick={() => setOpen(open === i ? -1 : i)}><div className="row"><b className="grow">{f.q}</b><span className="gold">{open === i ? "−" : "+"}</span></div>{open === i && <p className="muted fade" style={{ marginBottom: 0 }}>{f.a}</p>}</div>)}
        <div className="row" style={{ marginTop: 16 }}><button onClick={() => go({ v: "home" })}>Start learning</button><button className="ghost" onClick={() => go({ v: "landing" })}>Back home</button></div></div>;
    }
    // More: just the tiles again, so every page is reachable from the bottom bar.
    function More({ go }) { return <div className="fade stagger"><div className="eyebrow">Explore</div><h2>Everything on QuantBuddy</h2><PageGrid go={go} /></div>; }

    // VideosPage: every topic with a Watch button, plus 'Add link' so a student can paste their own playlist (saved on that device).
    function VideosPage({ d, setPl }) {
      const [open, setOpen] = useState(null), [val, setVal] = useState("");
      return <div className="fade stagger"><div className="eyebrow">Watch</div><h2>Video playlists</h2>
        <p className="muted">Tap Watch to open YouTube. Found a playlist you like? Tap Add link and paste it. It’s saved on this device.</p>
        {live.map(m => <div key={m.id}><h3>{m.title}</h3>{m.topics.map(t => {
          const mine = d.pl?.[t.id], id = t.playlist?.en;
          const url = mine || (id ? "https://www.youtube.com/playlist?list=" + id : "https://www.youtube.com/results?search_query=" + encodeURIComponent(t.search));
          return <div className="card" key={t.id}><div className="row"><div className="grow"><b>{t.title}</b><div className="muted">{mine || id ? "Your playlist" : "YouTube search"}</div></div>
            <a href={url} target="_blank" rel="noopener"><button className="sm">Watch ↗</button></a>
            <button className="ghost sm" onClick={() => { setOpen(open === t.id ? null : t.id); setVal(mine || ""); }}>Add link</button></div>
            {open === t.id && <div className="row" style={{ marginTop: 10 }}><input type="search" className="grow" placeholder="Paste a YouTube link" value={val} onChange={e => setVal(e.target.value)} />
              <button className="sm" onClick={() => { const v = val.trim(); if (v === "" || /^https?:\/\//.test(v)) { setPl(t.id, v); setOpen(null); } }}>Save</button></div>}</div>;
        })}</div>)}</div>;
    }

    // Tracker: personal stats worked out from the saved data d: topics done, quiz accuracy, cards known, weak topics.
    function Tracker({ d, go, reset, setName }) {
      const [sure, setSure] = useState(false);
      const all = flat.length, done = flat.filter(x => d.done?.[x.t.id]).length, v = pct(done, all);
      const sc = Object.entries(d.scores || {}), tot = sc.reduce((a, [, s]) => a + s, 0), max = sc.reduce((a, [id]) => a + (flat.find(x => x.t.id === id)?.t.quiz.length || 0), 0);
      const cards = Object.values(d.cards || {}), know = cards.filter(x => x === "know").length;
      const weak = flat.filter(x => d.scores?.[x.t.id] != null && d.scores[x.t.id] < x.t.quiz.length);
      const st = d.streak && (d.streak.last === day(0) || d.streak.last === day(1)) ? d.streak.n : 0;
      return <div className="fade stagger"><div className="eyebrow">Personal</div><h2>{d.name ? d.name + "’s tracker" : "My tracker"}</h2>
        <input type="search" placeholder="Your name (optional)" value={d.name || ""} onChange={e => setName(e.target.value)} />
        <div className="hero"><div style={{ position: "relative" }}><Ring v={v} /><div className="big" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24 }}><Num v={v} s="%" /></div></div>
          <div><b>{done} of {all} topics done</b><div className="muted">Keep going. Small steps add up.</div></div></div>
        <div className="stats"><div><b><Num v={st} /></b>day streak</div><div><b>{max ? pct(tot, max) + "%" : "–"}</b>quiz accuracy</div><div><b>{know}/{cards.length}</b>cards known</div></div>
        <div className="stats"><div><b>{d.mixed ?? "–"}</b>best mixed /6</div><div><b>{d.fbest ?? "–"}</b>best facts /6</div></div>
        <h3>By module</h3>{live.map(m => <div className="card" key={m.id}><div className="row"><b className="grow">{m.title}</b><b className="gold">{modPct(m, d)}%</b></div><Bar v={modPct(m, d)} /></div>)}
        <h3>Weak spots</h3>{weak.length ? weak.map(x => <div className="card row" key={x.t.id}><div className="grow"><b>{x.t.title}</b><div className="muted">Quiz {d.scores[x.t.id]}/{x.t.quiz.length}</div></div><button className="sm" onClick={() => go({ v: "topic", m: x.m.id, t: x.t.id })}>Revisit</button></div>)
          : <p className="muted">Nothing here yet. Take a few quizzes and your weak topics will show up.</p>}
        <div style={{ marginTop: 20 }}>{sure ? <div className="row"><span className="muted grow">Erase all progress on this device?</span><button className="sm" onClick={() => { reset(); setSure(false); }}>Yes, reset</button><button className="ghost sm" onClick={() => setSure(false)}>Cancel</button></div>
          : <button className="ghost sm" onClick={() => setSure(true)}>Reset my progress</button>}</div></div>;
    }

    // Quizzes: the quiz hub. 'run' remembers which quiz is open; when it's empty we show the list instead.
    function Quizzes({ d, setScore, setMixed }) {
      const [run, setRun] = useState(null);
      if (run) return <div className="fade stagger"><button className="ghost sm" onClick={() => setRun(null)}>← All quizzes</button><h2>{run.title}</h2>
        <Quiz key={run.k} qs={run.qs} label={run.title} setScore={sc => run.id ? setScore(run.id, sc) : setMixed(sc)} /></div>;
      return <div className="fade stagger"><div className="eyebrow">Test yourself</div><h2>Quizzes</h2>
        <div className="card"><b className="serif" style={{ fontSize: 18 }}>Mixed challenge</b><div className="muted">6 random questions from every topic. Best: {d.mixed ?? "–"}/6</div>
          <button className="sm" style={{ marginTop: 8 }} onClick={() => setRun({ title: "Mixed challenge", k: Date.now(), qs: shuffle(flat.flatMap(x => x.t.quiz)).slice(0, 6) })}>Start</button></div>
        {live.map(m => <div key={m.id}><h3>{m.title}</h3>{m.topics.map(t => <div className="card row" key={t.id}><div className="grow"><b>{t.title}</b>
          <div className="muted">{t.quiz.length} questions{d.scores?.[t.id] != null ? " · best " + d.scores[t.id] + "/" + t.quiz.length : ""}</div></div>
          <button className="sm" onClick={() => setRun({ title: t.title, id: t.id, k: Date.now(), qs: t.quiz })}>Take quiz</button></div>)}</div>)}</div>;
    }

    // Practice: two tabs, a flashcard drill (Revise queue = cards you haven't marked 'know') and generated number drills.
    function Practice({ d, mark, touch }) {
      const [tab, setTab] = useState("cards"), [queue, setQueue] = useState(true), [i, setI] = useState(0), [flip, setFlip] = useState(false), [set, setSet] = useState(null);
      const all = flat.flatMap(x => x.t.cards.map((c, j) => ({ ...c, key: x.t.id + ":" + j, topic: x.t.title })));
      const deck = queue ? all.filter(c => d.cards?.[c.key] !== "know") : all;
      const c = deck.length ? deck[i % deck.length] : null;
      const rate = k => { mark(c.key, k); setFlip(false); if (!(k && queue)) setI(i + 1); };
      return <div className="fade stagger"><div className="eyebrow">Level up</div><h2>Practice</h2>
        <div className="tabs"><button className={tab === "cards" ? "on" : ""} onClick={() => setTab("cards")}>Flashcards</button><button className={tab === "drill" ? "on" : ""} onClick={() => setTab("drill")}>Number drills</button></div>
        {tab === "cards" && <><div className="tabs"><button className={queue ? "on" : ""} onClick={() => { setQueue(true); setI(0); }}>Revise queue</button><button className={!queue ? "on" : ""} onClick={() => { setQueue(false); setI(0); }}>All cards</button></div>
          {c ? <div className="card"><div className="eyebrow">{c.topic} · {deck.length} in this deck</div>
            <div className={"flip" + (flip ? " on" : "")} onClick={() => setFlip(!flip)}><div><div className="face">{c.f}</div><div className="face back">{c.b}</div></div></div>
            <p className="muted">Tap to flip.</p><div className="row"><button className="grow" onClick={() => rate(true)}>Know it</button><button className="ghost grow" onClick={() => rate(false)}>Revise again</button></div></div>
            : <div className="card"><b>All caught up.</b><p className="muted">You know every card. Switch to All cards to keep them fresh.</p></div>}</>}
        {tab === "drill" && (set ? <><Quiz key={set.k} qs={set.qs} label="Drill" setScore={touch} /><button className="ghost" onClick={() => setSet({ k: Date.now(), qs: Array.from({ length: 5 }, makeQ) })}>New set</button></>
          : <div className="card"><b className="serif" style={{ fontSize: 18 }}>Quick number drills</b><p className="muted">Five fresh questions every time: averages, the rule of 72 and dice probability.</p>
            <button onClick={() => setSet({ k: Date.now(), qs: Array.from({ length: 5 }, makeQ) })}>Start drill</button></div>)}</div>;
    }

    // FactsRound: true/false game. 6 random statements; the best score is saved.
    function FactsRound({ d, setBest }) {
      const [deck, setDeck] = useState(() => shuffle(TF).slice(0, 6));
      const [i, setI] = useState(0), [ans, setAns] = useState(null), [sc, setSc] = useState(0), [end, setEnd] = useState(false);
      const q = deck[i];
      const pick = v => { if (ans !== null) return; setAns(v); if (v === q.a) setSc(sc + 1); };
      const next = () => { if (i + 1 < deck.length) { setI(i + 1); setAns(null); } else { setEnd(true); setBest(sc); if (sc === deck.length) burst(); } };
      const again = () => { setDeck(shuffle(TF).slice(0, 6)); setI(0); setAns(null); setSc(0); setEnd(false); };
      const cls = v => "opt" + (ans !== null ? (v === q.a ? " right" : v === ans ? " wrong" : "") : "");
      return <div className="fade stagger"><div className="eyebrow">Fun facts round</div><h2>True or false?</h2>
        {end ? <div className="card"><div className="eyebrow">Round complete</div><p className="big">{sc} / {deck.length}</p><p className="muted">Best ever: {Math.max(d.fbest || 0, sc)}/6</p><button onClick={again}>Play again</button></div>
          : <div className="card"><div className="eyebrow">Question {i + 1} of {deck.length}</div><p className="serif" style={{ fontSize: 20 }}>{q.s}</p>
            <div className="tf"><button className={cls(true)} onClick={() => pick(true)}>True</button><button className={cls(false)} onClick={() => pick(false)}>False</button></div>
            {ans !== null && <><p className="muted">{q.why}</p><button onClick={next}>{i + 1 < deck.length ? "Next" : "Finish"}</button></>}</div>}
        <h3>Fact library</h3>{FACTS.map((f, k) => <div className="card" key={k}>{f}</div>)}</div>;
    }

    /* ===== 6. APP ===== */
    // APP: the boss component. It holds the saved data (d) and the current page (view), and decides what to show.
    // Everything flows from here: pages receive data and helper functions as props.
    function App() {
      const [d, setD] = useState(load), [view, setView] = useState(fromHash);
      // go(): changes the page by changing the address hash. Every button on the site uses this.
      const go = o => { const h = toHash(o); if (location.hash.slice(1) === h) setView(fromHash()); else location.hash = h; };
      // Listens for the address changing (Back button, links) and updates the page to match.
      useEffect(() => { const f = () => setView(fromHash()); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
      // Dark mode is the default. The theme choice is saved with everything else.
      const dark = d.dark !== false;
      useEffect(() => { document.documentElement.dataset.theme = dark ? "dark" : "light"; }, [dark]);
      useEffect(() => window.scrollTo(0, 0), [view]);
      // update(): the ONE way we change saved data. It makes the new data, saves it to the browser (save(n)) and redraws.
      // toggle / setScore / mark / setPl etc. below all just call update with a small change.
      const update = fn => setD(p => { const n = fn(p); save(n); return n; });
      const toggle = id => update(p => bump({ ...p, done: { ...p.done, [id]: !p.done?.[id] } }));
      const setScore = (id, s) => update(p => bump({ ...p, scores: { ...p.scores, [id]: s } }));
      const mark = (k, know) => update(p => bump({ ...p, cards: { ...p.cards, [k]: know ? "know" : "revise" } }));
      const setPl = (id, u) => update(p => ({ ...p, pl: { ...p.pl, [id]: u } }));
      const setName = n => update(p => ({ ...p, name: n }));
      const setMixed = sc => update(p => bump({ ...p, mixed: Math.max(p.mixed || 0, sc) }));
      const setFactBest = sc => update(p => bump({ ...p, fbest: Math.max(p.fbest || 0, sc) }));
      const touch = () => update(p => bump(p));
      const reset = () => update(p => ({ dark: p.dark }));
      const m = MODULES.find(x => x.id === view.m), t = m?.topics?.find(x => x.id === view.t);
      const streak = d.streak && (d.streak.last === day(0) || d.streak.last === day(1)) ? d.streak.n : 0;
      const nv = v => go({ v });
      // The page layout returned below: ticker on top, header, the current page, then the nav bars. NAV is the menu list.
      const items = NEWS.map(n => n.h);
      const NAV = [["landing", "Home"], ["home", "Learn"], ["practice", "Practice"], ["tracker", "Tracker"], ["more", "More"]];
      const isOn = k => view.v === k || (k === "home" && (view.v === "mod" || view.v === "topic")) || (k === "more" && ["news", "videos", "quizzes", "facts", "gloss", "about"].includes(view.v));
      return <>
        <div className="tick" onClick={() => nv("news")} style={{ cursor: "pointer" }}><div>{[...items, ...items].map((h, i) => <span key={i}><b>▲</b>{h}</span>)}</div></div>
        <div className={"wrap" + (view.v === "landing" ? " wide" : "")}>
          <header><div className="logo" onClick={() => nv("landing")}>Quant<span>Buddy</span></div>
            <div className="topnav">{NAV.map(([k, l]) => <button key={k} className={isOn(k) ? "on" : ""} onClick={() => nv(k)}>{l}</button>)}</div>
            <div className="row">{streak > 0 && <span className="muted gold">{streak}-day streak</span>}
              <button className="ghost sm" onClick={() => update(p => ({ ...p, dark: !dark }))}>{dark ? "Light" : "Dark"}</button></div></header>
          {(view.v === "landing" || !KNOWN.includes(view.v) || (view.v === "mod" && !m) || (view.v === "topic" && !t)) && <Landing go={go} />}
          {view.v === "home" && <Home d={d} go={go} />}
          {view.v === "mod" && m && <Module m={m} d={d} go={go} toggle={toggle} />}
          {view.v === "topic" && m && t && <Topic m={m} t={t} d={d} go={go} toggle={toggle} setScore={setScore} mark={mark} />}
          {view.v === "news" && <News />}
          {view.v === "gloss" && <Glossary />}
          {view.v === "videos" && <VideosPage d={d} setPl={setPl} />}
          {view.v === "tracker" && <Tracker d={d} go={go} reset={reset} setName={setName} />}
          {view.v === "practice" && <Practice d={d} mark={mark} touch={touch} />}
          {view.v === "quizzes" && <Quizzes d={d} setScore={setScore} setMixed={setMixed} />}
          {view.v === "facts" && <FactsRound d={d} setBest={setFactBest} />}
          {view.v === "more" && <More go={go} />}
          {view.v === "about" && <About go={go} />}
        </div>
        <div className="nav">{NAV.map(([k, l]) => <button key={k} className={isOn(k) ? "on" : ""} onClick={() => nv(k)}>{l}</button>)}</div>
      </>;
    }
    // START THE APP: tell React to draw <App /> inside the #root box. This is the last line.
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
