<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         html{
            scroll-behavior: smooth;
        }
        body h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <form>
    <h1> Registration Form</h1>
    <h2>Fill the required details </h2>
    <hr/>
    <div>
    <label for="first-name">First name </label>
    <input type="text" id="first-name" placeholder="your name " required> 
</input >
</div>
   <br/>
    <div>
    <label for="last-name">Last name </label>
    <input type="text" id="last-name" placeholder="your name " required> 
</input >
</div>

<br/>

<div>
    <label for="email">Email </label>
    <input type="email" id="email" placeholder="you@email " required> 
</input >
</div>

<br/>
<div>
    <label for="campus">Campus</label>
    <input type="text" id="fcampus" readonly  value="Sushant uni"> 
</input >
</div>
<br/>
<div>
    <label for="password">Password </label>
    <input type="password" id="password" placeholder="*******" required minlength="6"> 
</input >
</div>
<br/>
<div>
    <label for="mobile">Mobile </label>
    <input type="number" id="mobile" placeholder="00000-00000" required> 
</input >
</div>

<br/>

<div>
    <label for="age">Age </label>
    <input type="number" id="age" placeholder="Your age" required> 
</input >
</div>

<br/>

<div>
    <label for="DOB">DOB </label>
    <input type="date" id="DOB" required> 
</input >
</div>

<br/>

<div>
    <label for="Profile_pic">Profile pic</label>
    <input type="file" id="Profile_pic" required> 
</input >
</div>

<br/>

<div>
    <button type="submit">Register</button>
</input >
</div>
</form>

</body>
</html>
